<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 128 128" fill="none">
  <!--
    PremoLux bot avatar
    ──────────────────
    Ilova uslubi: qora fon (#000), oq chiziq (#FFF), yumaloq uchlar.
    "Qo'lda chizilgan" effekt — bosh 4 ta alohida chiziq sifatida
    chizilgan, uchlarini joyi 1–2 birlikcha o'tib ketadi
    (ilovadagi Sketch komponenti kabi).

    Telegram: @BotFather → /setuserbot → bot-avatar.png (640×640)
  -->
  <rect width="128" height="128" fill="#000"/>

  <!-- bosh — 4 ta chiziq, uchlar joyi kamayib ketgan -->
  <g stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- chap tomon + tepa -->
    <path d="M31.8 62C31.4 50 33 42.4 39.6 40.6 53 39.2 75 39.2 88.4 40.6"/>
    <!-- o'ng tomon -->
    <path d="M92 40.6C94.6 43 96.6 50 96.2 64"/>
    <!-- o'ng past + past -->
    <path d="M96.6 61C97 76 97 88 96.2 93.4 95.2 97.6 92 99.8 86.6 100.6 71 101.4 53 101.4 37.4 100.6"/>
    <!-- chap past -->
    <path d="M37 101.2C32.6 100.2 30.6 97.2 31.4 93 30.4 87 30.6 75 31.6 59"/>
  </g>

  <!-- quloqlar — boshga tegib turadi -->
  <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M33 58.5H23.5c-1.4 0-2.5 1.1-2.5 2.5v6c0 1.4 1.1 2.5 2.5 2.5H33"/>
    <path d="M95 58.5h9.5c1.4 0 2.5 1.1 2.5 2.5v6c0 1.4-1.1 2.5-2.5 2.5H95"/>
  </g>

  <!-- antena -->
  <path d="M64 41.4V27.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="64" cy="21.2" r="4.2" fill="#fff"/>

  <!-- chap ko'z -->
  <circle cx="52" cy="68" r="4.4" fill="#fff"/>

  <!--
    o'ng ko'z — Premium yulduzi.
    Bot premium olish bilan shug'ullanadi, shuning uchun
    yulduz ko'z belgi qilib qo'yildi.
  -->
  <path d="M76 60.6c1 4.6 2.8 6.4 7.4 7.4-4.6 1-6.4 2.8-7.4 7.4-1-4.6-2.8-6.4-7.4-7.4 4.6-1 6.4-2.8 7.4-7.4z"
        fill="#fff"/>

  <!-- og'iz -->
  <path d="M57.5 82c2.4 3.2 10.6 3.2 13 0"
        stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
